<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Satoru Gojo - Menú</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: #0b0f14;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(180deg, #111a23 0%, #0b0f14 100%);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .banner {
    width: 100%;
    height: 280px;
    background: #22c55e url('banner.jpg') center/cover no-repeat;
    position: relative;
  }
  .banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(11,15,20,.95) 100%);
  }
  .content { padding: 24px; }
  h1 {
    font-size: 28px;
    margin-bottom: 10px;
    color: #a7f3d0;
  }
  .greeting { font-size: 20px; margin-bottom: 18px; }
  .subtitle { font-size: 16px; margin-bottom: 16px; opacity: .9; }
  .copyright {
    font-size: 11px;
    color: #7d8590;
    text-align: center;
    margin-bottom: 24px;
  }
  .buttons { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    background: #1f2937;
    color: #fff;
    text-align: center;
    border: 1px solid #30363d;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: all .2s;
  }
  .btn:hover { background: #22c55e; border-color: #22c55e; color: #0b0f14; }
  .btn.support { border-color: #3b82f6; color: #60a5fa; }
</style>
</head>
<body>
  <div class="card">
    <div class="banner"></div>
    <div class="content">
      <h1>Satoru gojo</h1>
      <p class="greeting">¡Buenos días! ☀️ {usuario}</p>
      <p class="subtitle">Selecciona el menu que necesites</p>
      <p class="copyright">Ⓒ Satoru gojo</p>
      <div class="buttons">
        <a class="btn" href="#">Menu</a>
        <a class="btn" href="#">Fast command</a>
        <a class="btn support" href="https://wa.me/59896719709">Support</a>
      </div>
    </div>
  </div>
</body>
</html>
